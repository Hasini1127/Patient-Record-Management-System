<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaCare | Patient Records</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef5ff;display:flex;align-items:center;justify-content:center;min-height:100vh;color:#183153}
.login{background:white;width:360px;padding:35px;border-radius:12px;box-shadow:0 8px 30px #17365d20}
h2{text-align:center;color:#1769aa;margin-bottom:8px}
p{text-align:center;color:#68778b;font-size:14px}
label{display:block;margin-top:18px;font-size:14px}
input{width:100%;padding:12px;margin-top:7px;border:1px solid #ccd8e5;border-radius:6px}
button{width:100%;padding:12px;margin-top:24px;background:#1769aa;color:white;border:0;border-radius:6px;font-size:16px;cursor:pointer}
button:hover{background:#104e80}
</style>
</head>
<body>
<div class="login">
<h2>NovaCare</h2>
<p>Patient Record Management System</p>
<form method="POST" action="/login">
<label>Username</label>
<input type="text" name="username" required>
<label>Password</label>
<input type="password" name="password" required>
<button type="submit">Login</button>
</form>
</div>
</body>
</html>
