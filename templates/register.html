<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | NovaCare</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef5ff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; width: 330px; box-shadow: 0 4px 20px #ccd8e8; }
        h2 { color: #1769aa; text-align: center; }
        input, button { box-sizing: border-box; width: 100%; padding: 12px; margin: 9px 0; border-radius: 6px; }
        input { border: 1px solid #ccd5e0; }
        button { background: #1769aa; color: white; border: 0; cursor: pointer; }
        a { color: #1769aa; }
        p { text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h2>NovaCare Registration</h2>
        <form method="POST" action="{{ url_for('register') }}">
            <input type="text" name="username" placeholder="Username" required>
            <input type="email" name="email" placeholder="Email address" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Create Account</button>
        </form>
        <p>Already registered? <a href="{{ url_for('login') }}">Login</a></p>
    </div>
</body>
</html>
